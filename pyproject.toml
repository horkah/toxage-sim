[project]
name = "toxage-sim"
version = "0.1.0"
description = "Synthetic data engine, risk models and app for toxicity of systemic cancer therapy"
readme = "README.md"
requires-python = ">=3.12"
# Engine, risk models and schema need only the standard library.
# Django is for the app, gunicorn serves it in the container.
dependencies = [
    "django==6.1.3",
    "gunicorn==23.0.0",
]

[tool.uv]
# The repository is a set of scripts and an app, not an installable package.
package = false
